name: Promote verified initial release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-verified-1.12.0.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagram-builder-promote-1.12.0
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'TechSavage1989/SwitchPort_Diagram_Builder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: TechSavage1989/SwitchPort_Diagram_Builder
      VALIDATED_SHA: 392951e6232576899255d678cad3fb0a09c3f1c2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require unchanged application source
        run: |
          git merge-base --is-ancestor "$VALIDATED_SHA" "$GITHUB_SHA"
          git diff --exit-code "$VALIDATED_SHA" "$GITHUB_SHA" -- Source global.json
      - name: Read original test, artifact and draft evidence
        id: proof
        run: |
          mkdir -p proof
          gh api "repos/$GH_REPO/actions/runs/40140473467" > proof/run.json
          gh api "repos/$GH_REPO/actions/runs/40140473467/jobs?filter=latest&per_page=100" --paginate --slurp > proof/jobs-pages.json
          gh api "repos/$GH_REPO/actions/artifacts/12579365266" > proof/artifact.json
          gh api "repos/$GH_REPO/releases/423029567" > proof/release.json
          python3 scripts/verify_initial_promotion.py --run-json proof/run.json --jobs-pages-json proof/jobs-pages.json --artifact-json proof/artifact.json --release-json proof/release.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: '12579365266'
          repository: TechSavage1989/SwitchPort_Diagram_Builder
          run-id: '40140473467'
          github-token: ${{ github.token }}
          path: dist
      - name: Verify original closed package and draft asset digests
        run: python3 scripts/verify_initial_promotion.py --run-json proof/run.json --jobs-pages-json proof/jobs-pages.json --artifact-json proof/artifact.json --release-json proof/release.json --directory dist
      - name: Publish the verified draft without changing any asset
        if: steps.proof.outputs.state == 'draft'
        run: gh api "repos/$GH_REPO/releases/423029567" --method PATCH -F draft=false -f make_latest=true > proof/release.json
      - name: Verify the published release by stable release ID
        run: |
          gh api "repos/$GH_REPO/releases/423029567" > proof/release.json
          python3 scripts/verify_initial_promotion.py --run-json proof/run.json --jobs-pages-json proof/jobs-pages.json --artifact-json proof/artifact.json --release-json proof/release.json --directory dist
          python3 scripts/verify_release_assets.py --directory dist --release-json proof/release.json --require-published
